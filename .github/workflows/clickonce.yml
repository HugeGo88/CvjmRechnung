name: Publish ClickOnce

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-clickonce:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CvjmRechnung/CvjmRechnung.csproj

      - name: Publish ClickOnce
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "clickonce-site"
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }

          dotnet publish CvjmRechnung/CvjmRechnung.csproj -c Release -p:PublishProfile=ClickOnce -p:PublishDir="$outDir"

      - name: Ensure landing index.html exists
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "clickonce-site"
          $indexPath = Join-Path $publishDir "index.html"

          if (-not (Test-Path $publishDir)) {
            throw "Publish output folder not found: $publishDir"
          }

          if (-not (Test-Path $indexPath)) {
            $app = Get-ChildItem -Path $publishDir -Recurse -File -Filter "*.application" | Select-Object -First 1
            $setup = Get-ChildItem -Path $publishDir -Recurse -File -Filter "setup.exe" | Select-Object -First 1

            $appHref = if ($app) { [IO.Path]::GetRelativePath($publishDir, $app.FullName).Replace('\\','/') } else { "" }
            $setupHref = if ($setup) { [IO.Path]::GetRelativePath($publishDir, $setup.FullName).Replace('\\','/') } else { "" }

            $appLink = if ($appHref) { "<li><a href='$appHref'>Install via ClickOnce (.application)</a></li>" } else { "" }
            $setupLink = if ($setupHref) { "<li><a href='$setupHref'>Download setup.exe</a></li>" } else { "" }

            $htmlLines = @(
              '<!doctype html>'
              '<html lang=''en''>'
              '<head>'
              '  <meta charset=''utf-8''>'
              '  <meta name=''viewport'' content=''width=device-width, initial-scale=1''>'
              '  <title>CvjmRechnung - Download</title>'
              '</head>'
              '<body>'
              '  <h1>CvjmRechnung</h1>'
              '  <p>Download and install:</p>'
              '  <ul>'
              "    $appLink"
              "    $setupLink"
              '  </ul>'
              '</body>'
              '</html>'
            )

            Set-Content -Path $indexPath -Value ($htmlLines -join [Environment]::NewLine) -Encoding UTF8
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload ClickOnce artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: clickonce-site

  deploy-pages:
    needs: publish-clickonce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
