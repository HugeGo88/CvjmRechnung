name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version
        id: get-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oE '<Version>[^<]+' CvjmRechnung/CvjmRechnung.csproj | sed 's/<Version>//')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read release settings
        id: release-settings
        shell: bash
        run: |
          REPOSITORY_URL="$(grep -oE '<RepositoryUrl>[^<]+' CvjmRechnung/CvjmRechnung.csproj | sed 's/<RepositoryUrl>//')"
          VELOPACK_VERSION="$(grep -oE '<VelopackVersion>[^<]+' CvjmRechnung/CvjmRechnung.csproj | sed 's/<VelopackVersion>//')"
          VELOPACK_PACK_ID="$(grep -oE '<VelopackPackId>[^<]+' CvjmRechnung/CvjmRechnung.csproj | sed 's/<VelopackPackId>//')"
          echo "repository_url=$REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "velopack_version=$VELOPACK_VERSION" >> "$GITHUB_OUTPUT"
          echo "velopack_pack_id=$VELOPACK_PACK_ID" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore CvjmRechnung/CvjmRechnung.csproj

      - name: Publish release build
        run: >
          dotnet publish CvjmRechnung/CvjmRechnung.csproj
          -c Release
          -o publish
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.get-version.outputs.version }}
          -p:AssemblyVersion=${{ steps.get-version.outputs.version }}.0
          -p:FileVersion=${{ steps.get-version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.get-version.outputs.version }}

      - name: Create Velopack release
        shell: bash
        run: |
          dotnet tool install -g vpk --version "${{ steps.release-settings.outputs.velopack_version }}"
          export PATH="$PATH:$HOME/.dotnet/tools"
          vpk download github --repoUrl "${{ steps.release-settings.outputs.repository_url }}" --token "${{ secrets.GITHUB_TOKEN }}"
          vpk pack -u "${{ steps.release-settings.outputs.velopack_pack_id }}" -v "${{ steps.get-version.outputs.version }}" -p publish
          vpk upload github --repoUrl "${{ steps.release-settings.outputs.repository_url }}" --publish --releaseName "CvjmRechnung ${{ steps.get-version.outputs.version }}" --tag "v${{ steps.get-version.outputs.version }}" --token "${{ secrets.GITHUB_TOKEN }}"
