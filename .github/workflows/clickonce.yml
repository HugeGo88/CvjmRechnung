name: Publish ClickOnce

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-clickonce:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CvjmRechnung/CvjmRechnung.csproj

      - name: Publish ClickOnce
        run: dotnet publish CvjmRechnung/CvjmRechnung.csproj -c Release -p:PublishProfile=ClickOnce

      - name: Resolve ClickOnce output path
        id: clickonce_output
        shell: pwsh
        run: |
          $publishDir = Get-ChildItem -Path "CvjmRechnung/bin/Release" -Recurse -Directory -Filter "app.publish" | Select-Object -First 1 -ExpandProperty FullName

          if (-not $publishDir) {
            $applicationFile = Get-ChildItem -Path "CvjmRechnung/bin/Release" -Recurse -File -Filter "*.application" | Select-Object -First 1
            if ($applicationFile) {
              $publishDir = $applicationFile.DirectoryName
            }
          }

          if (-not $publishDir) {
            throw "ClickOnce output folder not found under CvjmRechnung/bin/Release"
          }

          Write-Host "Resolved ClickOnce output: $publishDir"
          "path=$publishDir" >> $env:GITHUB_OUTPUT

      - name: Ensure landing index.html exists
        shell: pwsh
        run: |
          $publishDir = "${{ steps.clickonce_output.outputs.path }}"
          $indexPath = Join-Path $publishDir "index.html"

          if (-not (Test-Path $indexPath)) {
            $app = Get-ChildItem -Path $publishDir -File -Filter "*.application" | Select-Object -First 1
            $setup = Get-ChildItem -Path $publishDir -File -Filter "setup.exe" | Select-Object -First 1

            $appHref = if ($app) { $app.Name } else { "" }
            $setupHref = if ($setup) { $setup.Name } else { "" }

            $appLink = if ($appHref) { "<li><a href='$appHref'>Install via ClickOnce (.application)</a></li>" } else { "" }
            $setupLink = if ($setupHref) { "<li><a href='$setupHref'>Download setup.exe</a></li>" } else { "" }

            $htmlLines = @(
              '<!doctype html>'
              '<html lang=''en''>'
              '<head>'
              '  <meta charset=''utf-8''>'
              '  <meta name=''viewport'' content=''width=device-width, initial-scale=1''>'
              '  <title>CvjmRechnung - Download</title>'
              '</head>'
              '<body>'
              '  <h1>CvjmRechnung</h1>'
              '  <p>Download and install:</p>'
              '  <ul>'
              "    $appLink"
              "    $setupLink"
              '  </ul>'
              '</body>'
              '</html>'
            )

            Set-Content -Path $indexPath -Value ($htmlLines -join [Environment]::NewLine) -Encoding UTF8
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload ClickOnce artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.clickonce_output.outputs.path }}

  deploy-pages:
    needs: publish-clickonce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
